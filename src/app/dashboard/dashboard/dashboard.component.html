<div class="container mt-5" *ngIf="data">

  <div class="dashboard-header mb-4">
    <h3 class="mb-0">Manager Dashboard</h3>
  </div>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-title">Active Accounts</div>
        <div class="stat-value">{{ data.totalActiveAccounts }}</div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-title">Closed Accounts</div>
        <div class="stat-value muted">{{ data.totalClosedAccounts }}</div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-title">Total Clerks</div>
        <div class="stat-value">{{ data.totalClerks }}</div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="stat-card highlight">
        <div class="stat-title">Pending Withdrawals</div>
        <div class="stat-value">{{ data.pendingWithdrawals }}</div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="stat-card balance-card">
        <div class="stat-title">Total Bank Balance</div>
        <div class="stat-value">
          {{ data.totalBankBalance | currency:'INR' }}
        </div>
      </div>
    </div>

  </div>

</div>
