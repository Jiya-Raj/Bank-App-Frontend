<div class="container mt-5">

  <div class="card shadow-lg border-0 custom-card">

    <div class="card-header custom-header">
      <h4 class="mb-0">Clerk Management</h4>
    </div>

    <div class="card-body">

      <!-- Success / Error Messages -->
      <div *ngIf="successMessage" class="custom-alert success-alert">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="custom-alert error-alert">
        {{ errorMessage }}
      </div>

      <!-- Create Clerk Form -->
      <form #form="ngForm" (ngSubmit)="createClerk()">

        <div class="row mb-4 align-items-end">

          <div class="col">
            <label class="form-label small text-muted">Username</label>
            <input type="text"
                   class="form-control custom-input"
                   [(ngModel)]="newClerk.username"
                   name="username"
                   required>
          </div>

          <div class="col">
            <label class="form-label small text-muted">Password</label>
            <input type="password"
                   class="form-control custom-input"
                   [(ngModel)]="newClerk.password"
                   name="password"
                   required
                   minlength="6">
          </div>

          <div class="col-auto">
            <button class="btn btn-warm-create"
                    [disabled]="form.invalid">
              Add Clerk
            </button>
          </div>

        </div>
      </form>

      <hr class="custom-divider">

      <!-- Clerk Table -->
      <table class="table table-hover align-middle custom-table">

        <thead>
          <tr>
            <th>Username</th>
            <th class="text-end">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let clerk of clerks">
            <td class="fw-medium">{{ clerk }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-warm-delete"
                      (click)="deleteClerk(clerk)">
                Delete
              </button>
            </td>
          </tr>
        </tbody>

      </table>

    </div>
  </div>

</div>
